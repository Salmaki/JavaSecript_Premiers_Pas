<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bibliothèque</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Bibliothèque</h1>

<div class="container">
  <!-- Formulaire ajout -->
  <div class="form-section">
    <h2>Ajouter un livre</h2>
    <form id="formLivre" >
      <input type="number" id="code" placeholder="Code" required>
      <input type="text" id="titre" placeholder="Titre" required>
      <input type="text" id="auteur" placeholder="Auteur" required>
      <input type="number" id="annee" placeholder="Année" required>
      <input type="number" id="prix" placeholder="Prix en DH" required>
      <label>
        Disponible:
        <input type="checkbox" id="disponible" checked>
      </label>
      <button type="submit">Ajouter</button>
    </form>
  </div>

  <!-- Catalogue -->
  <div class="catalogue-section">
    <h2>Catalogue des livres</h2>
<input type="text" id="rechercher" placeholder="Rechercher un livre...">
<button id="btn-rechercher">Rechercher</button>
<button id="btn-trier">Trier (A-Z / Z-A)</button>
<p id="plusCher"></p>
  <div id="livresContainer"></div>
    <footer>
      <p id="totalLivres"></p>
      <p id="livresDisponibles"></p>
    </footer>
   </div>
</div>

<script src="script.js"></script>
</body>
</html>
